; Lineup Timetracker -- LilyGo T5 4.7" e-paper (ESP32-S3)
;
; The vendored LilyGo-EPD47 driver lives in lib/, where PlatformIO picks it up
; automatically together with its bundled zlib (needed to decompress the fonts).

[platformio]
name = lineup-timetracker
default_envs = T5-ePaper-S3
boards_dir = lib/LilyGo-EPD47-esp32s3/boards

[env:T5-ePaper-S3]
platform = espressif32@6.12.0
framework = arduino
board = T5-ePaper-S3

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder

; esptool 4.9 imports `intelhex`, which PlatformIO does not install into its
; virtualenv -- and a manual install is wiped whenever the core upgrades.
extra_scripts =
	pre:tools/ensure_esptool_deps.py
	pre:tools/load_dotenv.py

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3
	-DCORE_DEBUG_LEVEL=1

lib_deps =
	lewisxhe/SensorLib @ 0.3.1
	bblanchon/ArduinoJson @ ^7.4.2
